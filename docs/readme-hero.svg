<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Scoreboard project banner</title>
  <desc id="desc">A colorful dark scoreboard with green, cyan, coral and violet accents.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#102419"/><stop offset=".55" stop-color="#0b1718"/><stop offset="1" stop-color="#171327"/></linearGradient>
    <linearGradient id="lime" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#dcff8b"/><stop offset="1" stop-color="#72de85"/></linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8ae8dd"/><stop offset="1" stop-color="#4d9eb7"/></linearGradient>
    <linearGradient id="coral" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffd18e"/><stop offset="1" stop-color="#fa8d87"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#9eed66" stop-opacity=".22"/><stop offset="1" stop-color="#9eed66" stop-opacity="0"/></radialGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#85b396" opacity=".17"/></pattern>
  </defs>
  <rect width="1200" height="360" rx="28" fill="url(#background)"/>
  <rect width="1200" height="360" rx="28" fill="url(#dots)"/>
  <circle cx="290" cy="60" r="310" fill="url(#glow)"/>
  <circle cx="1070" cy="315" r="180" fill="#826ad9" opacity=".08"/>
  <path d="M0 280c150-65 250-50 370 40s250 85 410-5 270-30 420 25" fill="none" stroke="#91c985" stroke-opacity=".13" stroke-width="2"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="66" y="48" width="207" height="31" rx="15.5" fill="#baf477"/>
    <circle cx="82" cy="63.5" r="4" fill="#214b2d"/>
    <text x="95" y="69" font-size="12" font-weight="700" letter-spacing="1.7" fill="#183320">OPEN SOURCE PROJECT</text>
    <text x="63" y="162" font-size="73" font-weight="800" letter-spacing="-5" fill="#f1f9ef">SCORE</text>
    <text x="63" y="231" font-size="73" font-weight="800" letter-spacing="-5" fill="url(#lime)">BOARD<tspan fill="#e7f4e6">.</tspan></text>
    <text x="68" y="269" font-size="18" fill="#afc6b4">Every point tells a story.</text>
    <rect x="67" y="296" width="133" height="34" rx="17" fill="#203e39" stroke="#478e85"/>
    <circle cx="84" cy="313" r="5" fill="#80e2d5"/>
    <text x="96" y="318" font-size="11" font-weight="700" letter-spacing="1" fill="#b5f1e7">LIVE SCORING</text>
    <rect x="210" y="296" width="127" height="34" rx="17" fill="#382d42" stroke="#735d8f"/>
    <circle cx="227" cy="313" r="5" fill="#d4a3fb"/>
    <text x="239" y="318" font-size="11" font-weight="700" letter-spacing="1" fill="#ebd7ff">LOCAL FIRST</text>
    <g transform="translate(640 48)">
      <rect width="506" height="266" rx="22" fill="#11231e" stroke="#43684c" stroke-width="2"/>
      <rect x="1" y="1" width="504" height="49" rx="21" fill="#1e3528"/>
      <path d="M1 49h504" stroke="#365440"/>
      <circle cx="25" cy="26" r="6" fill="#f79791"/><circle cx="45" cy="26" r="6" fill="#ffd28f"/><circle cx="65" cy="26" r="6" fill="#b2ee86"/>
      <text x="375" y="31" font-size="11" letter-spacing="2" fill="#8db49b">SCORE / 01</text>
      <rect x="22" y="72" width="461" height="51" rx="12" fill="#213d2a" stroke="#659358"/>
      <circle cx="49" cy="97" r="16" fill="url(#lime)"/>
      <text x="44" y="103" font-size="15" font-weight="800" fill="#19341e">A</text>
      <text x="79" y="102" font-size="16" font-weight="700" fill="#eaf6e9">TEAM A</text>
      <text x="425" y="104" font-size="26" font-weight="800" fill="#c7fb89">24</text>
      <rect x="22" y="133" width="461" height="51" rx="12" fill="#1b3436" stroke="#3d7076"/>
      <circle cx="49" cy="158" r="16" fill="url(#cyan)"/>
      <text x="44" y="164" font-size="15" font-weight="800" fill="#11383b">B</text>
      <text x="79" y="163" font-size="16" font-weight="700" fill="#eaf6e9">TEAM B</text>
      <text x="425" y="165" font-size="26" font-weight="800" fill="#9cece0">18</text>
      <rect x="22" y="194" width="461" height="51" rx="12" fill="#3b302d" stroke="#8c6251"/>
      <circle cx="49" cy="219" r="16" fill="url(#coral)"/>
      <text x="44" y="225" font-size="15" font-weight="800" fill="#4e3028">C</text>
      <text x="79" y="224" font-size="16" font-weight="700" fill="#fff2e8">TEAM C</text>
      <text x="425" y="226" font-size="26" font-weight="800" fill="#ffc9a1">12</text>
    </g>
  </g>
</svg>
