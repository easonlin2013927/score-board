    attributes:
      value: |
        請先閱讀 [Wiki](https://github.com/easonlin2013927/score-board/wiki)。可使用繁體中文、简体中文、English 或日本語提問。

        Check the Wiki first, then ask in any supported language. Do not include personal data or full JSON backups.
