name: "📚 文件問題 / 文档问题 / Docs / ドキュメント"
description: "回報 Wiki 或 README 的錯誤 / Report a documentation issue / 文書の問題"
title: "[Docs] "
labels: ["documentation"]
body:
  - type: markdown
    attributes:
      value: |
        網站說明位於 [Wiki](https://github.com/easonlin2013927/score-board/wiki)，另有四種語言的 README。可使用繁體中文、简体中文、English 或日本語填寫。

        Report unclear, outdated, or missing documentation in any supported language.
  - type: input
    id: page
    attributes:
      label: "頁面連結 / 页面链接 / Page URL / ページの URL"
      placeholder: "https://github.com/easonlin2013927/score-board/wiki/..."
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: "需要修正的內容 / 需要修改的内容 / What needs fixing / 修正が必要な内容"
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: "建議文字 / 建议内容 / Suggested change / 修正案"
      description: "選填。 / Optional."
